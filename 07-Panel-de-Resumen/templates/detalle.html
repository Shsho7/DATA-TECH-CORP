<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detalle de solicitud</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>
<main class="contenedor">
  <section class="panel">
    <h1>Detalle de solicitud</h1>
    <h2>{{ solicitud['titulo'] }}</h2>
    <p>{{ solicitud['descripcion'] }}</p>
    <p>Prioridad: {{ solicitud['prioridad'] }}</p>
    <p>Estado actual: {{ solicitud['estado'] }}</p>
    <form method="post">
      <label>Actualizar estado
        <select name="estado">
          {% for opcion in ['pendiente', 'en progreso', 'completada'] %}
          <option value="{{ opcion }}" {% if solicitud['estado'] == opcion %}selected{% endif %}>{{ opcion|title }}</option>
          {% endfor %}
        </select>
      </label>
      <button type="submit">Guardar cambio</button>
    </form>
    <p><a href="{{ url_for('inicio') }}">Volver al panel</a></p>
  </section>
</main>
</body>
</html>
